<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FRIZ SHOP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --primary: #cc3333;
            --primary-glow: rgba(204, 51, 51, 0.4);
            --bg-dark: #0a0a0a;
            --bg-card: #120808;
            --border-color: #2a0a0a;
            --text-primary: #ffffff;
            --text-secondary: #999;
            --radius: 16px;
            --radius-xl: 28px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            padding: 16px 12px 80px 12px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(25px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        @keyframes rippleAnim {
            0% { transform: scale(0); opacity: 0.6; }
            100% { transform: scale(4); opacity: 0; }
        }

        .card-animate {
            animation: fadeUp 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
            opacity: 0;
        }
        .card-animate.delay-1 { animation-delay: 0.03s; }
        .card-animate.delay-2 { animation-delay: 0.06s; }
        .card-animate.delay-3 { animation-delay: 0.09s; }
        .card-animate.delay-4 { animation-delay: 0.12s; }
        .card-animate.delay-5 { animation-delay: 0.15s; }
        .card-animate.delay-6 { animation-delay: 0.18s; }
        .card-animate.delay-7 { animation-delay: 0.21s; }
        .card-animate.delay-8 { animation-delay: 0.24s; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 16px;
        }
        .header-logo {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, #cc3333, #ff5555);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .header-badge {
            background: var(--primary);
            color: #fff;
            border-radius: 50%;
            padding: 4px 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            min-width: 28px;
            text-align: center;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .header-badge:hover { transform: scale(1.08); }
        .header-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            border: 2px solid var(--primary);
            transition: 0.3s;
            color: #fff;
            text-transform: uppercase;
            user-select: none;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .header-avatar:hover {
            border-color: #ff5555;
            transform: scale(1.05);
        }

        .hero-title {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            padding: 8px 0 12px;
            background: linear-gradient(135deg, #cc3333, #ff5555, #cc3333);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            letter-spacing: -0.5px;
        }
        .hero-sub {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 16px;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            margin-bottom: 16px;
        }
        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }
        .search-input::placeholder { color: #555; }

        .filter-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 16px;
            flex-wrap: nowrap;
            scrollbar-width: none;
        }
        .filter-row::-webkit-scrollbar { display: none; }
        .filter-btn {
            flex-shrink: 0;
            padding: 8px 18px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 24px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }
        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .filter-btn:hover {
            background: #1a0e0e;
            color: #fff;
        }

        .catalog-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .product-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 18px 16px;
            border: 1px solid var(--border-color);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        .product-card:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(204, 51, 51, 0.08);
        }
        .product-card .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-card .left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .product-card .flag { font-size: 30px; line-height: 1; }
        .product-card .info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .product-card .code {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
        }
        .product-card .name {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .product-card .price {
            font-size: 20px;
            font-weight: 700;
            color: #ff4444;
            white-space: nowrap;
        }
        .product-card .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }
        .product-card .meta span {
            background: var(--bg-dark);
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }
        .product-card .meta .self-badge {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .product-card .btn-buy {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            background: var(--primary);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .product-card .btn-buy:hover {
            background: #bb2222;
            transform: scale(1.01);
        }
        .product-card .btn-buy:active { transform: scale(0.97); }
        .product-card .btn-buy .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.6s linear;
            pointer-events: none;
        }

        .empty-state {
            text-align: center;
            color: #555;
            padding: 60px 0;
            font-size: 16px;
        }
        .empty-state .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 16px;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .overlay.open { display: flex; }
        .modal {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: 32px 28px;
            width: 100%;
            max-width: 400px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9);
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .modal .avatar-lg {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin: 0 auto 12px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            box-shadow: 0 0 40px var(--primary-glow);
        }
        .modal .title {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4px;
        }
        .modal .sub {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 16px;
        }
        .modal .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 8px;
        }
        .modal .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .modal .btn-primary:hover { background: #bb2222; }
        .modal .btn-secondary {
            background: #2a2a2a;
            color: #fff;
        }
        .modal .btn-secondary:hover { background: #3a3a3a; }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-30px);
            background: var(--bg-card);
            color: #fff;
            padding: 12px 24px;
            border-radius: var(--radius);
            border: 1px solid var(--primary);
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            z-index: 9999;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            text-align: center;
            max-width: 90%;
            backdrop-filter: blur(8px);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bg-dark);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 16px 0;
            backdrop-filter: blur(12px);
            z-index: 100;
        }
        .bottom-nav a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: 0.3s;
            cursor: pointer;
            padding: 4px 12px;
            border-radius: 12px;
            user-select: none;
        }
        .bottom-nav a.active { color: var(--primary); }
        .bottom-nav a .icon { font-size: 24px; line-height: 1; }
        .bottom-nav a:hover { color: #fff; }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <!-- ПРОФИЛЬ (без баланса) -->
    <div class="overlay" id="profileOverlay">
        <div class="modal modal-animate">
            <div class="avatar-lg" id="profileAvatar">👤</div>
            <div class="title" id="profileName">Пользователь</div>
            <div class="sub" id="profileId">ID: 123456789</div>
            <button class="btn btn-primary" onclick="closeOverlay('profileOverlay')">✖ Закрыть</button>
        </div>
    </div>

    <div class="hero-title">🛒 FRIZ SHOP</div>
    <div class="hero-sub">🔥 Лучшие номера по лучшим ценам</div>

    <div class="header">
        <span class="header-logo">⚡</span>
        <div class="header-right">
            <span class="header-badge" id="cartCount" onclick="showCart()">0</span>
            <div class="header-avatar" id="avatarBtn" onclick="openProfile()">👤</div>
        </div>
    </div>

    <input class="search-input" id="searchInput" placeholder="🔍 Поиск по стране или коду..." />

    <div class="filter-row" id="filterRow">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="новорег">🆕 Новорег</button>
        <button class="filter-btn" data-filter="авторег">🤖 Авторег</button>
        <button class="filter-btn" data-filter="саморег">📱 Саморег</button>
        <button class="filter-btn" data-filter="отлега">⏳ Отлега</button>
    </div>

    <div class="catalog-grid" id="catalog"></div>

    <div class="bottom-nav">
        <a href="#" class="active" onclick="filterAll()"><span class="icon">🏠</span> Каталог</a>
        <a href="#" onclick="showCart()"><span class="icon">🛍</span> Корзина</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let cart = [];
        let currentFilter = 'all';
        let userData = tg.initDataUnsafe?.user || {};

        const rawCountries = [
            { code: "+1", flag: "🇺🇸", name: "США", base: 49, types: ["отлега"], spam: false },
            { code: "+1", flag: "🇺🇸", name: "США (спам)", base: 37, types: ["отлега"], spam: true },
            { code: "+52", flag: "🇲🇽", name: "Мексика", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+57", flag: "🇨🇴", name: "Колумбия", base: 80, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+62", flag: "🇮🇩", name: "Индонезия", base: 80, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+95", flag: "🇲🇲", name: "Мьянма", base: 35, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+233", flag: "🇬🇭", name: "Гана", base: 60, types: ["новорег", "авторег", "саморег"], spam: false },

            { code: "+234", flag: "🇳🇬", name: "Нигерия", base: 70, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+20", flag: "🇪🇬", name: "Египет", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+58", flag: "🇻🇪", name: "Венесуэла", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+963", flag: "🇸🇾", name: "Сирия", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+251", flag: "🇪🇹", name: "Эфиопия", base: 90, types: ["авторег", "саморег"], spam: false },
            { code: "+60", flag: "🇲🇾", name: "Малайзия", base: 90, types: ["авторег", "саморег"], spam: false },
            { code: "+51", flag: "🇵🇪", name: "Перу", base: 90, types: ["авторег", "саморег"], spam: false },
            { code: "+90", flag: "🇹🇷", name: "Турция", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+966", flag: "🇸🇦", name: "Саудовская Аравия", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+254", flag: "🇰🇪", name: "Кения", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+961", flag: "🇱🇧", name: "Ливан", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+967", flag: "🇾🇪", name: "Йемен", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+27", flag: "🇿🇦", name: "ЮАР", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },

            { code: "+226", flag: "🇧🇫", name: "Буркина-Фасо", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+252", flag: "🇸🇴", name: "Сомали", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+962", flag: "🇯🇴", name: "Иордания", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+256", flag: "🇺🇬", name: "Уганда", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+84", flag: "🇻🇳", name: "Вьетнам", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },

            { code: "+223", flag: "🇲🇱", name: "Мали", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+63", flag: "🇵🇭", name: "Филиппины", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },
            { code: "+237", flag: "🇨🇲", name: "Камерун", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },

            { code: "+213", flag: "🇩🇿", name: "Алжир", base: 90, types: ["авторег", "саморег", "новорег"], spam: false },
            { code: "+976", flag: "🇲🇳", name: "Монголия", base: 90, types: ["новорег", "авторег", "саморег"], spam: false },

            { code: "+998", flag: "🇺🇿", name: "Узбекистан", base: 199, types: ["отлега"], spam: false },
            { code: "+77", flag: "🇰🇿", name: "Казахстан", base: 150, types: ["отлега"], spam: false },
            { code: "+964", flag: "🇮🇶", name: "Ирак", base: 90, types: ["отлега"], spam: false },
            { code: "+880", flag: "🇧🇩", name: "Бангладеш", base: 79, types: ["отлега"], spam: false },
            { code: "+91", flag: "🇮🇳", name: "Индия", base: 40, types: ["отлега"], spam: false },
            { code: "+49", flag: "🇩🇪", name: "Германия", base: 90, types: ["отлега"], spam: false },
            { code: "+49", flag: "🇩🇪", name: "Германия (авто)", base: 179, types: ["авторег"], spam: false },
            { code: "+7", flag: "🇷🇺", name: "Россия", base: 250, types: ["отлега"], spam: false },
            { code: "+39", flag: "🇮🇹", name: "Италия", base: 90, types: ["отлега"], spam: false },
            { code: "+48", flag: "🇵🇱", name: "Польша", base: 90, types: ["отлега"], spam: false },
            { code: "+48", flag: "🇵🇱", name: "Польша (авто)", base: 149, types: ["авторег"], spam: false },
            { code: "+33", flag: "🇫🇷", name: "Франция", base: 90, types: ["отлега"], spam: false },
            { code: "+380", flag: "🇺🇦", name: "Украина", base: 299, types: ["отлега"], spam: false },
            { code: "+31", flag: "🇳🇱", name: "Нидерланды", base: 229, types: ["авторег"], spam: false },
            { code: "+372", flag: "🇪🇪", name: "Эстония", base: 199, types: ["авторег"], spam: false },
            { code: "+98", flag: "🇮🇷", name: "Иран", base: 169, types: ["авторег"], spam: false },
            { code: "+593", flag: "🇪🇨", name: "Эквадор", base: 85, types: ["авторег"], spam: false },
            { code: "+44", flag: "🇬🇧", name: "Великобритания", base: 159, types: ["авторег"], spam: false }
        ];

        const countries = [];
        rawCountries.forEach(item => {
            item.types.forEach(type => {
                let price = item.base;
                if (type === 'саморег') price = item.base + 50;
                countries.push({
                    code: item.code,
                    flag: item.flag,
                    name: item.name,
                    type: type,
                    price: price,
                    spam: item.spam
                });
            });
        });
        countries.sort((a, b) => a.price - b.price);

        function openOverlay(id) {
            document.getElementById(id).classList.add('open');
        }

        function closeOverlay(id) {
            document.getElementById(id).classList.remove('open');
        }

        function openProfile() {
            const user = userData;
            const name = user?.first_name || 'Пользователь';
            const id = user?.id || '—';
            const avatar = name.charAt(0).toUpperCase() || '👤';
            document.getElementById('profileAvatar').textContent = avatar;
            document.getElementById('profileName').textContent = name;
            document.getElementById('profileId').textContent = `ID: ${id}`;
            openOverlay('profileOverlay');
        }

        function renderCatalog(filter = 'all', search = '') {
            const container = document.getElementById('catalog');
            let filtered = countries;
            if (filter !== 'all') {
                filtered = filtered.filter(c => c.type === filter);
            }
            if (search) {
                const q = search.toLowerCase();
                filtered = filtered.filter(c =>
                    c.name.toLowerCase().includes(q) ||
                    c.code.includes(q)
                );
            }
            if (filtered.length === 0) {
                container.innerHTML =
                    `
                    <div class="empty-state">
                        <span class="icon">😔</span>
                        Нет номеров по вашему запросу
                    </div>
                `;
                return;
            }
            let html = '';
            filtered.forEach((c, index) => {
                const spamLabel = c.spam ? '🚫 Спам-блок' : '✅ Без спама';
                const typeLabel = c.type === 'саморег' ?
                    `<span class="self-badge">${c.type} (+50₽)</span>` :
                    `<span>${c.type}</span>`;
                const delayClass = `delay-${(index % 8) + 1}`;
                html += `
                    <div class="product-card card-animate ${delayClass}">
                        <div class="row">
                            <div class="left">
                                <span class="flag">${c.flag}</span>
                                <div class="info">
                                    <span class="code">${c.code}</span>
                                    <span class="name">${c.name}</span>
                                </div>
                            </div>
                            <span class="price">${c.price} ₽</span>
                        </div>
                        <div class="meta">
                            <span>${spamLabel}</span>
                            ${typeLabel}
                        </div>
                        <button class="btn-buy" onclick="addToCart('${c.code}', '${c.name} (${c.type})', ${c.price}, this)">
                            🛒 Купить
                        </button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function addToCart(code, name, price, btn) {
            cart.push({ code, name, price });
            document.getElementById('cartCount').textContent = cart.length;
            if (btn) {
                const rect = btn.getBoundingClientRect();
                const ripple = document.createElement('span');
                ripple.className = 'ripple';
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.left = '50%';
                ripple.style.top = '50%';
                ripple.style.transform = 'translate(-50%, -50%) scale(0)';
                btn.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            }
            showToast(`✅ ${name} добавлен в корзину`);
            tg.HapticFeedback.impactOccurred('light');
            tg.sendData(JSON.stringify({ action: 'update_cart', cart: cart }));
        }

        function showCart() {
            if (cart.length === 0) {
                showToast('🛍 Корзина пуста');
                return;
            }
            let text = '🛍 Ваша корзина:\n\n';
            let total = 0;
            cart.forEach((item, i) => {
                text += `${i + 1}. ${item.name} (${item.code}) — ${item.price} ₽\n`;
                total += item.price;
            });
            text += `\n💰 Итого: ${total} ₽`;
            tg.showAlert(text);
        }

        let toastTimer = null;

        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.classList.remove('show');
            }, 2500);
        }

        function filterAll() {
            currentFilter = 'all';
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('[data-filter="all"]').classList.add('active');
            renderCatalog('all', document.getElementById('searchInput').value);
        }

        document.getElementById('filterRow').addEventListener('click', (e) => {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            renderCatalog(currentFilter, document.getElementById('searchInput').value);
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderCatalog(currentFilter, e.target.value);
        });

        renderCatalog('all', '');
    </script>

</body>
</html>
