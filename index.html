<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRIZ SHOP</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            padding: 16px 12px 80px 12px;
            min-height: 100vh;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1f1f1f;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #0088cc, #00ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .cart-badge {
            background: #0088cc;
            color: #fff;
            border-radius: 50%;
            padding: 4px 10px;
            font-size: 14px;
            font-weight: 600;
        }
        .filter-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 16px;
            flex-wrap: nowrap;
        }
        .filter-row button {
            background: #1e1e1e;
            border: 1px solid #2a2a2a;
            color: #aaa;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-row button.active {
            background: #0088cc;
            border-color: #0088cc;
            color: #fff;
        }
        .card {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid #252525;
            transition: 0.2s;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .card-header .flag {
            font-size: 28px;
        }
        .card-header .code {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }
        .card-header .price {
            font-size: 20px;
            font-weight: 700;
            color: #00ccff;
        }
        .card-desc {
            font-size: 13px;
            color: #888;
            margin-bottom: 8px;
            line-height: 1.4;
        }
        .card-meta {
            display: flex;
            gap: 16px;
            font-size: 13px;
            color: #666;
            margin-bottom: 12px;
        }
        .card-meta span {
            background: #1e1e1e;
            padding: 2px 10px;
            border-radius: 12px;
        }
        .card .btn-buy {
            width: 100%;
            padding: 10px;
            background: #0088cc;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .card .btn-buy:hover {
            background: #0077b3;
        }
        .card .btn-buy:active {
            transform: scale(0.97);
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f0f0f;
            border-top: 1px solid #1a1a1a;
            display: flex;
            justify-content: space-around;
            padding: 10px 0 14px 0;
            backdrop-filter: blur(10px);
        }
        .bottom-nav a {
            color: #666;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            transition: 0.2s;
        }
        .bottom-nav a.active {
            color: #0088cc;
        }
        .bottom-nav a .icon {
            font-size: 22px;
        }
        .empty {
            text-align: center;
            color: #555;
            padding: 40px 0;
            font-size: 16px;
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #0088cc;
            color: #fff;
            padding: 10px 24px;
            border-radius: 12px;
            font-size: 14px;
            opacity: 0;
            transition: 0.3s;
            z-index: 999;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
        }
        .search-input:focus {
            border-color: #0088cc;
        }
    </style>
</head>
<body>

<div class="toast" id="toast">✅ Добавлено в корзину</div>

<div class="header">
    <h1>🛒 FRIZ SHOP</h1>
    <div class="cart-badge" id="cartCount">0</div>
</div>

<input class="search-input" id="searchInput" placeholder="🔍 Поиск по стране или коду..." />

<div class="filter-row" id="filterRow">
    <button class="active" data-filter="all">Все</button>
    <button data-filter="new">Новорег</button>
    <button data-filter="auto">Авторег</button>
    <button data-filter="self">Саморег</button>
    <button data-filter="otliga">С отлегой</button>
    <button data-filter="spam">Спам-блок</button>
</div>

<div id="catalog"></div>

<div class="bottom-nav">
    <a href="#" class="active" onclick="filterAll()"><span class="icon">🏠</span> Каталог</a>
    <a href="#"><span class="icon">🎁</span> Кейсы</a>
    <a href="#"><span class="icon">💳</span> Пополнить</a>
    <a href="#" onclick="openProfile()"><span class="icon">👤</span> Профиль</a>
</div>

<script>

        { code: "+380", flag: "🇺🇦", name: "Украина", desc: "отлега до 5 лет", price: 299, type: "otliga", spam: false },
        { code: "+31", flag: "🇳🇱", name: "Нидерланды", desc: "авто, 12 часов", price: 229, type: "auto", spam: false },
        { code: "+372", flag: "🇪🇪", name: "Эстония", desc: "авто, 1 день", price: 199, type: "auto", spam: false },
        { code: "+98", flag: "🇮🇷", name: "Иран", desc: "авто, 12 часов", price: 169, type: "auto", spam: false },
        { code: "+593", flag: "🇪🇨", name: "Эквадор", desc: "авто, 2 часа", price: 85, type: "auto", spam: false },
        { code: "+44", flag: "🇬🇧", name: "Великобритания", desc: "авто", price: 159, type: "auto", spam: false }
    ];

    function renderCatalog(filter = 'all', search = '') {
        const container = document.getElementById('catalog');
        let filtered = countries;

        if (filter !== 'all') {
            if (filter === 'spam') {
                filtered = filtered.filter(c => c.spam === true);
            } else {
                filtered = filtered.filter(c => c.type === filter);
            }
        }

        if (search) {
            const q = search.toLowerCase();
            filtered = filtered.filter(c => 
                c.name.toLowerCase().includes(q) || 
                c.code.includes(q)
            );
        }

        if (filtered.length === 0) {
            container.innerHTML = `<div class="empty">😔 Нет номеров по вашему запросу</div>`;
            return;
        }

        let html = '';
        filtered.forEach(c => {
            const spamLabel = c.spam ? '🚫 Спам-блок' : '✅ Без спама';
            html += `
                <div class="card">
                    <div class="card-header">
                        <span class="flag">${c.flag}</span>
                        <span class="code">${c.code}</span>
                        <span class="price">${c.price} ₽</span>
                    </div>
                    <div class="card-desc">${c.desc}</div>
                    <div class="card-meta">
                        <span>${spamLabel}</span>
                        <span>${c.type === 'new' ? '🆕 Новорег' : c.type === 'auto' ? '🤖 Авторег' : c.type === 'otliga' ? '⏳ Отлега' : '📱 Саморег'}</span>
                    </div>
                    <button class="btn-buy" onclick="addToCart('${c.code}', '${c.name}', ${c.price})">🛒 Купить</button>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function addToCart(code, name, price) {
        cart.push({ code, name, price });
        document.getElementById('cartCount').textContent = cart.length;
        showToast(`✅ ${name} (${code}) добавлен в корзину`);
        tg.HapticFeedback.impactOccurred('light');
    }

    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2500);
    }

    function filterAll() {
        currentFilter = 'all';
        document.querySelectorAll('.filter-row button').forEach(b => b.classList.remove('active'));
        document.querySelector('[data-filter="all"]').classList.add('active');
        renderCatalog('all', document.getElementById('searchInput').value);
    }

    document.getElementById('filterRow').addEventListener('click', (e) => {
        if (e.target.tagName === 'BUTTON') {
            document.querySelectorAll('.filter-row button').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentFilter = e.target.dataset.filter;
            renderCatalog(currentFilter, document.getElementById('searchInput').value);
        }
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
        renderCatalog(currentFilter, e.target.value);
    });

    function openProfile() {
        tg.showAlert('👤 Ваш профиль\n\nКорзина: ' + cart.length + ' товаров\nСумма: ' + cart.reduce((s, i) => s + i.price, 0) + ' ₽');
    }

    // Инициализация
    renderCatalog('all', '');
</script>

</body>
</html>
